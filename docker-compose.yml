services:
  web:
    build: .
    container_name: flask-hello-world
    ports:
      - "3500:3500"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
